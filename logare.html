<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare | [Nume Proiect Aeroport]</title>
    <style>
        /* Stiluri CSS de bază pentru un formular curat și centrat */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #003399; /* Culoarea primară */
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        /* Stiluri comune pentru ambele butoane */
        .btn-base {
            width: 100%;
            padding: 12px;
            background-color: #003399;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            text-decoration: none; /* Pentru link-uri */
            display: block; /* Asigură că link-ul ocupă toată lățimea */
            text-align: center;
        }

        .btn-base:hover {
            background-color: #002277;
        }

        /* Stiluri specifice butoanelor */
        .login-button {
            margin-bottom: 15px; /* Spațiu sub butonul de Logare */
        }
        
        /* Selector CSS corectat */
        .creare-cont-button { 
            margin-top: 10px;
            background-color: #5cb85c; /* O culoare diferită pentru a le distinge (verde) */
        }

        .creare-cont-button:hover {
            background-color: #449d44;
        }
        
        .role-info {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #777;
        }
        
        .role-info ul {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
            text-align: left;
        }
        .role-info li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Autentificare Utilizator</h2>

        <form action="/api/login" method="POST">
            
            <div class="form-group">
                <label for="username">Nume Utilizator (Username):</label>
                <input type="text" id="username" name="username" placeholder="Ex: admin_aeroport sau vizitator" required>
            </div>

            <div class="form-group">
                <label for="password">Parolă:</label>
                <input type="password" id="password" name="password" placeholder="Introduceți parola" required>
            </div>

            <button type="submit" class="login-button btn-base">LOGHEAZĂ-TE</button>
        </form>
        
        <a href="/inregistrare.html" class="creare-cont-button btn-base">CREAZĂ UN CONT</a>
        

        <div class="role-info">
            <p>Accesul tău depinde de rolul tău:</p>
            <ul>
                <li>**Vizitator:** Căutare și vizualizare zboruri/bilete.</li>
                <li>**Admin/Operator:** Acces pentru gestionarea datelor.</li>
            </ul>
        </div>
    </div>

</body>
</html>
