<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creare Cont Nou | [Nume Proiect Aeroport]</title>
    <style>
        /* Stiluri CSS consistente cu pagina de login */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px; /* Puțin mai mare pentru a cuprinde mai multe câmpuri */
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #003399; /* O culoare verde pentru a sugera "Succes/Nou" */
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            background-color: #003399;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .register-button:hover {
            background-color: #003399;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #003399;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Crează un Cont Nou</h2>

        <form action="/api/register" method="POST">
            
            <div class="form-group">
                <label for="username">Nume Utilizator:</label>
                <input type="text" id="username" name="username" placeholder="Alege un nume unic" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="email">Adresă Email:</label>
                <input type="email" id="email" name="email" placeholder="exemplu@domeniu.ro" required maxlength="100">
            </div>

            <div class="form-group">
                <label for="password">Parolă:</label>
                <input type="password" id="password" name="password" placeholder="Minim 8 caractere" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmă Parola:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Reintroduceți parola" required>
            </div>

            <div class="form-group" style="display: none;">
                <label for="rol">Rol (Implicit):</label>
                <input type="hidden" name="rol" value="operator"> 
            </div>

            <button type="submit" class="register-button">ÎNREGISTREAZĂ-TE</button>
        </form>

        <a href="login.html" class="login-link">Ai deja cont? Autentifică-te</a>
    </div>

</body>
</html>
